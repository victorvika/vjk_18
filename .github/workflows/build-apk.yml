name: Build GoldPulse APK

on:
  workflow_dispatch:
  push:
    branches: [arena/1f2e083e-vjk-18]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Unit tests + assemble in one invocation so a compile error is reported once.
      - name: Build and test
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # CI logs are not always retrievable, so publish the failure onto the commit.
      - name: Report failure to commit
        if: steps.gradle.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Gradle failure"
            echo '```'
            # Assertion text lives in the XML/HTML reports, not the console.
            if [ -d app/build/test-results/testDebugUnitTest ]; then
              echo "## Test failures"
              grep -h -A6 "<failure" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -100 || true
              echo
            fi
            echo "## Compiler / task errors"
            grep -E "e: file|error:|FAILED|Execution failed" build.log | head -60 || true
            echo '```'
            echo
            echo "<details><summary>tail</summary>"
            echo
            echo '```'
            tail -150 build.log
            echo '```'
            echo "</details>"
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat report.md)" > /dev/null || true
          echo "Posted failure report to commit ${{ github.sha }}"

      - name: Fail if build failed
        if: steps.gradle.outcome == 'failure'
        run: exit 1

      - name: Verify the APK is installable
        id: verify
        run: |
          set -o pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          {
            echo "### APK verification"
            echo
            if [ -d app/build/test-results/testDebugUnitTest ]; then
              T=$(grep -h -o 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              F=$(grep -h -o 'failures="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              E=$(grep -h -o 'errors="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              echo "**Unit tests:** ${T:-0} run, ${F:-0} failed, ${E:-0} errors"
              echo
            fi
            echo
            echo "**Size:** $(stat -c%s "$APK") bytes"
            echo
            echo "#### Badging"
            echo '```'
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -E "^(package|application-label|launchable-activity|sdkVersion|targetSdkVersion|uses-permission)" | head -20
            echo '```'
            echo
            echo "#### Signature"
            echo '```'
            "$BT/apksigner" verify --verbose "$APK" 2>&1 | head -15
            echo '```'
            echo
            echo "#### Contents"
            echo '```'
            unzip -l "$APK" | grep -E "classes.*dex|resources.arsc|AndroidManifest|lib/" | head -12
            echo '```'
            echo
            echo "#### DEX class check"
            echo '```'
            for c in "Lcom/vjk/goldpulse/MainActivity;"                      "Lcom/vjk/goldpulse/strategy/lsms/LsmsEngine;"                      "Lcom/vjk/goldpulse/strategy/lsms/Instrument;"                      "Lcom/vjk/goldpulse/strategy/lsms/Sizing;"                      "Lcom/vjk/goldpulse/data/YahooCandleSource;"; do
              if "$BT/dexdump" -f "$APK" 2>/dev/null | grep -q "Class descriptor.*$c"; then
                echo "FOUND    $c"
              else
                echo "MISSING  $c"
              fi
            done
            echo '```'
          } > apk-verify.md
          cat apk-verify.md

      - name: Report APK verification to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments"             -f body="$(cat apk-verify.md)" > /dev/null || true

      - name: Prepare release file
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/GoldPulse.apk
          ls -lh release/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldPulse-APK
          path: release/*.apk
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: goldpulse-v1.0.${{ github.run_number }}
          name: "GoldPulse v1.0.${{ github.run_number }}"
          body: |
            **GoldPulse** — GC / MGC gold futures analysis for FundedNext Futures.

            **Install**
            1. Download `GoldPulse.apk` below.
            2. On the phone allow "Install unknown apps" for your browser or file manager.
            3. Open the app — market data loads automatically (no login, no API key).

            **What it does**
            - Candlestick chart for GC / MGC, 1m to 1D
            - LSMS engine: liquidity sweep -> structure break -> FVG entry -> liquidity target
            - Liquidity map: swing highs/lows, EQH/EQL, PDH/PDL, Asian range
            - Contract sizing for GC ($100/pt) and MGC ($10/pt), with a micro fallback
            - Prop-firm guard: daily loss limit, max loss limit, losing-trade stop
            - "Losses left" against the $2,000 max loss limit

            **Data**
            Phase 1 uses Yahoo Finance (`GC=F`, ~10 min delayed). Phase 2 will use the
            Tradovate API from your FundedNext account for real-time CME data.

            **Not a signal service.** The app shows the setup the rules produce and the
            size your risk plan allows. Entries are still yours to place on Tradovate.
          files: release/*.apk
